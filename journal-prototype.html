<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEKU Journal</title><body style="background:#071f1b;color:white;font-family:sans-serif;padding:24px"><h1>DEKU 音声ジャーナル試作</h1><p id="q"></p><textarea id="a" style="width:100%;height:120px"></textarea><p><button onclick="record()">🎙 音声入力</button> <button onclick="next()">次へ</button></p><pre id="out" style="white-space:pre-wrap"></pre><script>const qs=['今日一番うまくいったことは？','うまくいった理由は？','今日の課題は？','改善するには？','明日やることは？'];let i=0,answers=[];const q=document.getElementById('q'),a=document.getElementById('a'),out=document.getElementById('out');q.textContent=qs[i];function record(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert('音声認識非対応。キーボード音声入力を使ってください');return}const r=new R();r.lang='ja-JP';r.onresult=e=>a.value+=(a.value?' ':'')+e.results[0][0].transcript;r.start()}function next(){if(!a.value.trim())return alert('回答を入力してください');answers.push(a.value.trim());a.value='';if(++i<qs.length){q.textContent=qs[i]}else{q.textContent='振り返り完了';out.textContent=answers.map((v,j)=>qs[j]+'\n'+v).join('\n\n');const date=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});localStorage.setItem('deku_journal_'+date,JSON.stringify(answers))}}</script></body></html>
