<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEKU｜履歴復旧</title><style>*{box-sizing:border-box}body{background:#071f1b;color:#f4fff9;font-family:system-ui,sans-serif;margin:0}main{max-width:600px;margin:auto;padding:24px}section{background:#0f2f29;border:1px solid #246a58;border-radius:16px;padding:18px;margin:16px 0}button{border:0;border-radius:12px;background:#f5d547;color:#172019;font-size:16px;font-weight:800;padding:13px 18px;margin:5px 0}button:disabled{opacity:.45}a{color:#72f2da}small{color:#b9d7cc}pre{white-space:pre-wrap;overflow-wrap:anywhere}strong{color:#f5d547}</style></head><body><main><a href="./index.html">← DEKUに戻る</a><h1>DEKU｜履歴復旧</h1><p>Googleスプレッドシートに残っている記録を、現在の端末のDEKUへ<strong>追加</strong>します。既存の記録は削除・上書きしません。</p><section><h2>1. 端末のバックアップ</h2><button id="backup">現在のデータをダウンロード</button><p><small>空に見えていても、先に現在の端末データを保存します。</small></p></section><section><h2>2. Google Sheetsの記録を確認</h2><button id="connect">Googleで接続して確認</button><p id="status">読み取り専用でアクセスします。Googleの認証画面が表示されます。</p><div id="preview"></div></section><section id="restoreSection" hidden><h2>3. 追加復旧</h2><p>現在の端末にない記録だけを追加します。<strong>この操作は自動でGoogle Sheetsへ書き戻しません。</strong></p><button id="restore">不足分をDEKUに追加</button></section><script src="https://accounts.google.com/gsi/client" async defer></script><script>
"use strict";const $=id=>document.getElementById(id),sheetId="1dqHpTdUqhW1kgBGv9wydmFaeraqi3BJf1wmq2QS6Lq4",clientId="207350844424-eoimuqkn8ens2j8pti5nlflg95mqj5fo.apps.googleusercontent.com";let candidateLogs=[],candidateReports={},pending=false;
function read(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||"null");return v??fallback}catch{return fallback}}
function download(){const payload={version:"0.9",exportedAt:new Date().toISOString(),logs:read("dekuLogs",[]),reports:read("dekuReports",{}),goals:read("dekuGoals",{months:{},weeks:{},days:{}}),learnings:read("dekuLearnings",[]),tasks:read("dekuTasks",[])};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="deku-before-recovery-"+Date.now()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
$("backup").onclick=download;
function day(v){const s=String(v||"").trim().replace(/\//g,"-");const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0"):""}
function num(v){const n=Number(v);return Number.isFinite(n)&&n>=0?n:0}
function fingerprint(x){return [day(new Date(x.t).toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"})),x.cat||"",num(x.c),num(x.a),num(x.connect),x.result||"",x.next||"",x.memo||""].join("|")}
function parseLogs(rows){return rows.slice(1).map((r,i)=>{const d=day(r[1])||day(r[0]);if(!d)return null;const stamp=Date.parse(d+"T12:00:00+09:00");if(!Number.isFinite(stamp))return null;return{id:"recovered-sheet-"+(i+2),cat:String(r[2]||"その他"),c:num(r[3]),a:num(r[4]),connect:num(r[5]),result:String(r[6]||""),next:String(r[7]||""),memo:String(r[8]||""),t:stamp}}).filter(Boolean)}
function parseReports(rows){const out={};for(const r of rows.slice(1)){const d=day(r[0]);if(!d)continue;out[d]={good:String(r[7]||""),reflection:String(r[8]||""),tomorrow:String(r[9]||""),savedAt:Date.now()}}return out}
async function sheet(token,name){const url="https://sheets.googleapis.com/v4/spreadsheets/"+sheetId+"/values/"+encodeURIComponent("'"+name+"'!A1:K1000");const response=await fetch(url,{headers:{Authorization:"Bearer "+token}});if(!response.ok)throw Error("Google Sheets 読み込み失敗 (HTTP "+response.status+")");return (await response.json()).values||[]}
$("connect").onclick=()=>{if(pending)return;if(!window.google?.accounts?.oauth2){$("status").textContent="Google認証の読み込み中です。少し待って再試行してください。";return}pending=true;$("status").textContent="Googleに接続中…";const client=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:"https://www.googleapis.com/auth/spreadsheets.readonly",callback:async response=>{try{if(response.error)throw Error(response.error);$("status").textContent="スプレッドシートを読み込み中…";const [logs,reports]=await Promise.all([sheet(response.access_token,"行動ログ"),sheet(response.access_token,"日報")]);candidateLogs=parseLogs(logs);candidateReports=parseReports(reports);const currentLogs=read("dekuLogs",[]),currentReports=read("dekuReports",{}),existing=new Set(currentLogs.map(fingerprint)),missing=candidateLogs.filter(x=>!existing.has(fingerprint(x))),missingReports=Object.keys(candidateReports).filter(k=>!currentReports[k]);$("preview").textContent="Sheets 行動ログ "+candidateLogs.length+"件・日報 "+Object.keys(candidateReports).length+"件 / 端末に追加候補：行動ログ "+missing.length+"件、日報 "+missingReports.length+"件";$("status").textContent="読み取り完了。追加候補を確認してください。";$("restoreSection").hidden=false}catch(e){$("status").textContent="接続できませんでした："+e.message}finally{pending=false}}});client.requestAccessToken({prompt:"consent"})};
$("restore").onclick=()=>{if(!candidateLogs.length&&!Object.keys(candidateReports).length)return;const existingLogs=read("dekuLogs",[]),existingReports=read("dekuReports",{}),known=new Set(existingLogs.map(fingerprint)),added=[];for(const item of candidateLogs){const fp=fingerprint(item);if(!known.has(fp)){added.push(item);known.add(fp)}}let count=0;for(const [d,report]of Object.entries(candidateReports)){if(!existingReports[d]){existingReports[d]=report;count++}}if(!confirm("行動ログ "+added.length+"件、日報 "+count+"件を追加します。既存の記録は上書きしません。よろしいですか？"))return;download();try{localStorage.setItem("dekuLogs",JSON.stringify([...existingLogs,...added]));localStorage.setItem("dekuReports",JSON.stringify(existingReports));$("status").textContent="追加完了：行動ログ "+added.length+"件、日報 "+count+"件。DEKUを開いて確認してください。";$("restoreSection").hidden=true}catch(e){$("status").textContent="保存失敗："+e.message+"。ダウンロードしたバックアップを保持してください。"}};
</script></main></body></html>
